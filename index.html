<!DOCTYPE html>
<html lang="ru">
<head>
	<title>Твоя веха</title>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
	<link rel="stylesheet" href="index.css">
	<link rel="stylesheet" href="ptsansweb/stylesheet.css">
	<link rel="stylesheet" href="vanilla-calendar-pro/styles/layout.css">
	<link rel="stylesheet" href="vanilla-calendar-pro/styles/themes/light.css">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
	<p>
		<span id="timer">--:--</span>
		<br>
		<span id="end_date">--</span>
	</p>
	<div id="progress" class="progress">
		<div class="progress__background">
			<div class="progress__line">
				<span>0%</span>
			</div>
		</div>
	</div>
	<div class="empty_space"></div>
	<div>
		<button id="copy_milestone_link">Скопировать в буфер ссылку на веху</button>
		<button id="select_new_date_bt">Выбрать другую дату</button>
	</div>
	<a href="https://github.com/Mendeo/milestone">Что это?</a>
	<script type="module" src="index.js"></script>
</body>
</html>
